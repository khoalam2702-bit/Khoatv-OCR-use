<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCR</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <strong>OCR → FBO</strong>
    <span id="who"></span>
    <button id="btn-fbo-login" class="link" title="Điền tài khoản đã lưu vào trang đăng nhập FBO ở tab hiện tại" hidden>Đăng nhập FBO</button>
    <button id="btn-inspect" class="link" title="Dò các ô của form FBO đang xem và sao chép kết quả (để bổ sung ánh xạ)">Dò form</button>
    <button id="btn-settings" class="link" title="Cài đặt">Cài đặt</button>
    <button id="btn-logout" class="link" hidden>Đăng xuất</button>
  </header>
  <div id="msg" class="msg" hidden></div>
  <details id="inspect-box" hidden><summary>Kết quả dò form (đã sao chép; bấm để xem)</summary><textarea id="inspect-out" readonly rows="10" style="width:100%"></textarea></details>
  <div id="quota-bar" class="msg warn" role="status" hidden></div>
  <div id="perm-bar" class="msg info" hidden><span id="perm-text">Cần cấp quyền để điền form FBO.</span> <button id="btn-perm" class="primary">Cấp quyền FBO</button></div>

  <section id="view-login" hidden>
    <label>Tên đăng nhập<input id="in-user" autocomplete="username"></label>
    <label>Mật khẩu<input id="in-pass" type="password" autocomplete="current-password"></label>
    <label class="chk"><input id="in-remember" type="checkbox" checked> Ghi nhớ tài khoản và mật khẩu trên máy này</label>
    <button id="btn-login" class="primary">Đăng nhập</button>
    <p class="hint">Dùng tài khoản của Web Admin OCR. Mật khẩu (nếu ghi nhớ) được mã hoá và chỉ lưu trên trình duyệt này.</p>
  </section>

  <section id="view-scan" hidden>
    <h2>1. Chọn loại tài liệu</h2>
    <div id="types" class="types"></div>
    <h2>2. Thêm ảnh hoặc PDF</h2>
    <div id="drop" class="drop" tabindex="0">Kéo thả tệp vào đây, dán ảnh (Ctrl+V) hoặc <button id="btn-pick" class="link">chọn tệp</button></div>
    <input id="in-files" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple hidden>
    <ul id="files" class="files"></ul>
    <p id="limit-hint" class="hint"></p>
    <label id="row-relation" hidden>Người phụ thuộc là <select id="in-relation"><option value="CON">Con (mã 01)</option><option value="CHA_ME">Cha, mẹ (mã 03)</option></select></label>
    <label class="chk" id="row-qronly" hidden><input id="in-qronly" type="checkbox"> CCCD: chỉ đọc mã QR (nhanh, không dùng AI). Quê quán, nơi sinh, ngày hết hạn tự nhập.</label>
    <button id="btn-scan" class="primary" disabled>Quét</button>
    <progress id="scan-progress" class="fillbar" max="100" value="0" hidden></progress>
    <div id="scan-info" class="hint" role="status" hidden></div>
  </section>

  <section id="view-review" hidden>
    <h2 id="review-title">Kiểm tra kết quả</h2>
    <form id="form" autocomplete="off"></form>
    <div id="review-actions" class="row">
      <button id="btn-back" type="button">Quét lại</button>
      <button id="btn-save" type="button" class="primary">Lưu</button>
    </div>
    <div id="after-save" hidden>
      <div id="save-info" class="ok"></div>
      <div class="row">
        <button id="btn-fill" type="button" class="primary">Điền vào FBO</button>
        <button id="btn-stop" type="button" class="danger" hidden>Dừng</button>
        <button id="btn-next" type="button">Quét tiếp</button>
      </div>
      <progress id="fill-progress" class="fillbar" max="1" hidden></progress>
      <div id="fill-info" class="hint"></div>
    </div>
  </section>

  <script src="lib/vendor/jsqr.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
