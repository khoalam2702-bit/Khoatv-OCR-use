<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OCR Tài liệu</title>
<style>
  :root{color-scheme:light dark;--bg:#f1f5f9;--panel:#fff;--line:#cbd5e1;--tx1:#0f172a;--tx3:#64748b;--pri:#2563eb;--prih:#1d4ed8}
  @media (prefers-color-scheme:dark){:root{--bg:#020617;--panel:#0b1220;--line:#1e293b;--tx1:#fff;--tx3:#9aa8bd}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--tx1);
    font:14.5px/1.45 '72','Segoe UI','Be Vietnam Pro',Arial,sans-serif}
  .card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center}
  .logo{width:44px;height:44px;margin:0 auto 12px;border-radius:12px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800}
  h1{font-size:18px;margin:0 0 6px}
  p{margin:0 0 16px;color:var(--tx3)}
  a.btn{display:block;padding:11px 14px;border-radius:8px;background:var(--pri);color:#fff;text-decoration:none;font-weight:700}
  a.btn:hover{background:var(--prih)}
  .warn{color:#b45309}
</style>
</head>
<body>
<main class="card">
  <div class="logo">OCR</div>
  <h1>Quét &amp; nhận dạng tài liệu</h1>
  <p id="msg">Đang chuyển đến ứng dụng...</p>
  <a class="btn" id="go" href="#" hidden>Mở ứng dụng</a>
</main>
<script>
  // Dán URL Web App của Apps Script vào đây (dạng https://script.google.com/macros/s/.../exec).
  // Lấy sau khi Deploy > New deployment > Web app trong Apps Script.
  var APP_URL = '{{ASC_EXEC_URL}}';

  var ok = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(APP_URL);
  var msg = document.getElementById('msg'), go = document.getElementById('go');
  if (ok) {
    go.href = APP_URL; go.hidden = false;
    location.replace(APP_URL);
  } else {
    msg.textContent = 'Chưa cấu hình địa chỉ ứng dụng. Quản trị viên cần điền APP_URL trong public/index.html.';
    msg.className = 'warn';
  }
</script>
<noscript><p style="text-align:center">Vui lòng bật JavaScript để mở ứng dụng.</p></noscript>
</body>
</html>
